<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Warm Stone Surface -->
  <rect width="320" height="80" rx="20" fill="#FAF9F5"/>
  <rect x="1" y="1" width="318" height="78" rx="19" stroke="#E8E7E0" stroke-width="2"/>
  
  <!-- Aced Twin-Circle Emblem -->
  <g transform="translate(24, 16)">
    <!-- Primary Dark Disc -->
    <circle cx="20" cy="24" r="16" fill="#141413"/>
    <!-- Overlapping Stroked Ring -->
    <circle cx="34" cy="24" r="16" stroke="#141413" stroke-width="4" fill="#FAF9F5"/>
  </g>
  
  <!-- Aced Editorial Wordmark -->
  <text x="96" y="51" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="700" fill="#141413" letter-spacing="-0.5">Aced</text>
  <circle cx="196" cy="46" r="3" fill="#141413"/>
</svg>
